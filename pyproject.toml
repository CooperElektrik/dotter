[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotter"
version = "0.1.0"
description = "A visual novel engine built on pyglet using the inProse narrative DSL."
requires-python = ">=3.12"
dependencies = [
    "pyglet>=2.1.0",
    "inprose @ git+https://github.com/CooperElektrik/inProse.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
    "import-linter>=2.0",
]

[project.scripts]
dotter = "dotter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
